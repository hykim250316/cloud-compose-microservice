services:
  web-app:
    container_name: web-app
    build: ./web-app
    env_file: .env
    ports: 
      - "80:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped