services:
  web-app:
    container_name: web-app
    build: ./web-app
    env_file: .env
    ports: 
      - "80:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - frontend
    depends_on:
      api:
        condition: service_healthy
  api:
    container_name: api
    build: ./api
    env_file: .env
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - frontend
      - backend
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
  database:
    container_name: db
    image: postgres:18-alpine
    env_file: .env
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./init-scripts/01-init.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - backend
  pgweb:
    container_name: pgweb
    image: sosedoff/pgweb:0.17.0
    env_file: .env
    ports:
      - "8081:8081"
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/api/info"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - backend
  redis:
    container_name: redis
    image: redis:8-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    env_file: .env
    restart: unless-stopped
    volumes:
      - redis-data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping"]
      interval: 10s
      timeout: 3s
      retries: 3
  prometheus:
    container_name: prometheus
    image: prom/prometheus:v3
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
      - --storage.tsdb.retention.time=200h
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    volumes:
      - prometheus-data:/prometheus
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: always
    networks:
      - frontend
      - backend
      - monitoring
  grafana:
    container_name: grafana
    image: grafana/grafana:13.2-slim
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_LOG_LEVEL=error
    ports:
      - "3000:3000"
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: always
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana-dashboards:/var/lib/grafana/dashboards
      - ./monitoring/grafana-provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana-provisioning/datasources:/etc/grafana/provisioning/datasources
    networks:
      - monitoring
  pgweb-exporter:
    container_name: pgweb-exporter
    image: prom/blackbox-exporter:v0.28.0
    env_file: .env
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:9115/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: always
    volumes:
      - ./monitoring/blackbox.yml:/etc/blackbox_exporter/config.yml
    networks:
      - backend
      - monitoring
  postgres-exporter:
    container_name: postgres-exporter
    image: prometheuscommunity/postgres-exporter:v0.20.1
    env_file: .env
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:9187/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: always
    depends_on:
      database:
        condition: service_healthy
    networks:
      - backend
      - monitoring
  redis-exporter:
    container_name: redis-exporter
    image: oliver006/redis_exporter:v1.92.0-alpine
    env_file: .env
    environment:
      - REDIS_ADDR=redis://redis:6379
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:9121/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: always
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - backend
      - monitoring
networks:
  frontend:
  backend:
  monitoring:
volumes:
  postgres-data:
  redis-data:
  prometheus-data:
  grafana-data:
